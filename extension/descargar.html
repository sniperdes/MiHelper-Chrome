<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MiHelper - Descargador de Stream</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f8fafc;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
    }
    .panel-descarga {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 30px;
      width: 500px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h2 { margin-top: 0; color: #1e293b; font-size: 20px; }
    .status-text { display: flex; justify-content: space-between; font-size: 14px; color: #64748b; margin-bottom: 8px; }
    .barra-progreso { width: 100%; height: 16px; background: #e2e8f0; border-radius: 8px; overflow: hidden; }
    .progreso-celeste { width: 0%; height: 100%; background: #38bdf8; transition: width 0.2s ease; }
    .velocidad { font-weight: bold; color: #0284c7; }
  </style>
</head>
<body>

  <div class="panel-descarga">
    <h2 id="titulo-video">Descargando transmisión...</h2>
    <div class="status-text">
      <span id="porcentaje-texto">Progreso: 0%</span>
      <span id="velocidad-texto" class="velocidad">Calculando...</span>
    </div>
    <div class="barra-progreso">
      <div id="barra" class="progreso-celeste"></div>
    </div>
    <p id="mensaje-estado" style="font-size: 12px; color: #94a3b8; margin-top: 15px;">Descargando fragmentos multimedia en la memoria local...</p>
  </div>

  <script src="descargar.js"></script>
</body>
</html>
