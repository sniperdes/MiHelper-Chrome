<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MiHelper</title>
  <style>
    /* Forzamos el tamaño fijo del popup aquí */
    body {
      width: 400px;
      min-height: 250px;
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background-color: #fcfcfc;
      color: #333;
    }

    h2 {
      margin-top: 0;
      color: #222;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 8px;
    }

    #analizar {
      width: 100%;
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #analizar:hover {
      background-color: #0052a3;
    }

    #resultado {
      margin-top: 15px;
    }

    /* Estilo para los cuadros de texto de los enlaces */
    textarea {
      width: 100%;
      height: 50px;
      margin-top: 5px;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      resize: none;
      box-sizing: border-box; /* Evita que se salga del borde */
    }

    /* Botón de copiar estilizado */
    .btn-copiar {
      cursor: pointer;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 3px;
      margin-top: 4px;
    }

    .btn-copiar:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <h2>MiHelper 📹</h2>

  <button id="analizar">Analizar página</button>
<!-- NUEVO: Botón para reiniciar el radar de la pestaña -->
  <button id="limpiar" style="width: 100%; background-color: #6c757d; color: white; border: none; padding: 6px; font-size: 12px; margin-top: 5px; border-radius: 4px; cursor: pointer;">Limpiar Capturas 🗑️</button>

  <div id="resultado"></div>

  <script src="popup.js"></script>
</body>
</html>
