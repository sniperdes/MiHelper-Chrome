
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MiHelper</title>
  <style>
    body {
      width: 420px;
      min-height: 200px;
      margin: 0;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f8fafc;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #1e293b;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    #analizar {
      width: 100%;
      background-color: #0f172a;
      color: white;
      border: none;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    #analizar:hover { background-color: #1e293b; }
    #limpiar {
      width: 100%;
      background-color: #edf2f7;
      color: #4a5568;
      border: none;
      padding: 6px;
      font-size: 11px;
      margin-top: 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    #limpiar:hover { background-color: #e2e8f0; }
    #resultado { margin-top: 15px; }
  </style>
</head>
<body>

  <h2>MiHelper 📹</h2>

  <button id="analizar">Analizar página</button>
  <button id="limpiar">Limpiar Capturas 🗑️</button>

  <div id="resultado"></div>

  <script src="popup.js"></script>
</body>
</html>
